<!--
  _ticker_widget.html — shared overlay event-ticker widget.

  Included by overlay_game.html (corner element) and overlay_ticker.html
  (standalone browser source). Renders a rolling feed of game chatter events:
  newest on top, last ~5 visible, old lines fade after ~8s, and bursts are
  paced with small gaps instead of instant-replacing each other.

  Rule of thumb (mirrored in server/handlers/chat_bridge.py):
    Continuous or multi-step events → ticker. Results and personal replies →
    chat. One chat line per completed event, rewards included.

  The page's WebSocket handler feeds events in via:
    window.TickerFeed.handleEvent(payload)   — payload of a ticker_event msg

  Events carry server-stamped seq numbers; a gap in the sequence renders a
  small "missed events" marker instead of failing silently. The ticker is a
  live feed, not a log — history missed while disconnected is skipped.
-->
<style>
  #ticker-feed {
    position: fixed;
    bottom: 80px;
    right: 40px;
    width: 480px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    pointer-events: none;
    font-family: 'Georgia', 'Times New Roman', serif;
  }
  /* Standalone browser source (~520×300): fill the viewport, anchor bottom. */
  body.ticker-standalone #ticker-feed {
    left: 10px;
    right: 10px;
    bottom: 10px;
    width: auto;
  }

  .ticker-line {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 8px 14px;
    border-radius: 8px;
    background: rgba(10, 8, 5, 0.82);
    border-left: 3px solid #c9a84c;
    color: #f0e6c8;
    /* Keep the feed readable at stream resolution — never below 15px. */
    font-size: 15px;
    line-height: 1.35;
    box-shadow: 0 4px 16px rgba(0,0,0,0.5);
    backdrop-filter: blur(4px);
    animation: ticker-in 0.3s ease forwards;
  }
  .ticker-line.ticker-out { animation: ticker-fade 0.6s ease forwards; }

  .ticker-line.cat-duel    { border-left-color: #e07070; }
  .ticker-line.cat-quest   { border-left-color: #7bc8ff; }
  .ticker-line.cat-reward  { border-left-color: #9146ff; }
  .ticker-line.cat-grant   { border-left-color: #9146ff; }
  .ticker-line.cat-levelup { border-left-color: #70c070; }
  .ticker-line.cat-death   { border-left-color: #9a9a9a; }
  .ticker-line.cat-power   { border-left-color: #e0a040; }

  .ticker-line.ticker-gap {
    border-left-color: rgba(240,230,200,0.35);
    color: rgba(240,230,200,0.55);
    font-size: 13px;
    font-style: italic;
    padding: 4px 14px;
  }

  .ticker-icon { flex-shrink: 0; font-size: 16px; }
  .ticker-text { flex: 1; min-width: 0; overflow-wrap: break-word; }

  @keyframes ticker-in {
    from { opacity: 0; transform: translateY(-10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes ticker-fade {
    from { opacity: 1; }
    to   { opacity: 0; }
  }
</style>

<div id="ticker-feed" aria-live="polite"></div>

<script>
window.TickerFeed = (function () {
  'use strict';

  var MIN_GAP_MS  = 1200;  // pacing between line insertions when bursts arrive
  var LINE_TTL_MS = 8000;  // visible lifetime before a line fades out
  var MAX_VISIBLE = 5;
  var MAX_PENDING = 12;    // burst backlog cap — beyond this the oldest drop

  // Default icon per category (an event's own icon field wins).
  var CATEGORY_ICONS = {
    duel: '⚔️', quest: '🗺️', reward: '⭐', grant: '🎁',
    levelup: '🎉', death: '☠️', power: '✨',
  };

  var pending = [];
  var drainTimer = null;
  var lastInsertAt = 0;
  var lastSeq = 0;

  function esc(s) {
    return String(s || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  /** Entry point: payload of a ticker_event WS message. */
  function handleEvent(p) {
    if (!p || !p.text) return;
    var seq = parseInt(p.seq || 0, 10);
    if (seq > 0) {
      if (lastSeq > 0 && seq > lastSeq + 1) {
        // Dropped events (reconnect skip, server-side drop): never silent —
        // show one marker rather than replaying history (live feed, not a log).
        enqueue({ gap: true });
      }
      // seq <= lastSeq means the server restarted its counter — just resync.
      lastSeq = seq;
    }
    var category = String(p.category || 'event');
    enqueue({
      category: category,
      icon: String(p.icon || CATEGORY_ICONS[category] || '📜'),
      text: String(p.text),
    });
  }

  function enqueue(line) {
    if (line.gap && pending.length && pending[pending.length - 1].gap) return;
    if (pending.length >= MAX_PENDING) pending.shift();
    pending.push(line);
    scheduleDrain();
  }

  function scheduleDrain() {
    if (drainTimer) return;
    var wait = Math.max(0, lastInsertAt + MIN_GAP_MS - Date.now());
    drainTimer = setTimeout(drain, wait);
  }

  function drain() {
    drainTimer = null;
    var line = pending.shift();
    if (!line) return;
    insert(line);
    lastInsertAt = Date.now();
    if (pending.length) scheduleDrain();
  }

  function insert(line) {
    var feed = document.getElementById('ticker-feed');
    if (!feed) return;

    var el = document.createElement('div');
    if (line.gap) {
      el.className = 'ticker-line ticker-gap';
      el.innerHTML = '<span class="ticker-text">⋯ some events were missed</span>';
    } else {
      var cat = String(line.category || '').replace(/[^a-z0-9_-]/gi, '');
      el.className = 'ticker-line' + (cat ? ' cat-' + cat : '');
      el.innerHTML =
        '<span class="ticker-icon">' + esc(line.icon) + '</span>' +
        '<span class="ticker-text">' + esc(line.text) + '</span>';
    }
    feed.insertBefore(el, feed.firstChild);  // newest on top

    while (feed.children.length > MAX_VISIBLE) {
      feed.removeChild(feed.lastChild);
    }

    setTimeout(function () {
      if (!el.parentNode) return;
      el.classList.add('ticker-out');
      setTimeout(function () {
        if (el.parentNode) el.parentNode.removeChild(el);
      }, 650);
    }, LINE_TTL_MS);
  }

  return { handleEvent: handleEvent };
})();
</script>
